[package]
name = "canter"
version = "0.1.0"
edition = "2024"
description = "Keyboard-driven terminal reader for Canvas LMS"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.2"
html2text = "0.17.3"
# Decoding only, for images drawn in page text: PNG, JPEG and GIF cover every
# embedded image Canvas serves here. Default features would add a dozen more
# formats and their decoders.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
open = "5.4.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "gzip", "charset", "json", "system-proxy", "query"] }
bytes = "1.12.1"
http-body = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Outside Windows the session is sealed with a key kept in the system
# keychain: Keychain on macOS, the Secret Service elsewhere.
chacha20poly1305 = "0.11.0"
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Its own small executor, so a blocking call is safe inside Tokio.
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = "debuginfo"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }
